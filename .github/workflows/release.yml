name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: cargo xtask bundle hardwave-loudlab --release

      - name: Package
        run: |
          cd target/bundled
          zip -r hardwave-loudlab-linux-x64.zip hardwave-loudlab.vst3 hardwave-loudlab.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-loudlab-linux-x64
          path: target/bundled/hardwave-loudlab-linux-x64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo xtask bundle hardwave-loudlab --release

      - name: Package
        shell: bash
        run: |
          cd target/bundled
          7z a -tzip hardwave-loudlab-windows-x64.zip hardwave-loudlab.vst3 hardwave-loudlab.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-loudlab-windows-x64
          path: target/bundled/hardwave-loudlab-windows-x64.zip

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build
        run: cargo xtask bundle hardwave-loudlab --release --target x86_64-apple-darwin

      - name: Package
        run: |
          cd target/bundled
          zip -r hardwave-loudlab-macos-x64.zip hardwave-loudlab.vst3 hardwave-loudlab.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-loudlab-macos-x64
          path: target/bundled/hardwave-loudlab-macos-x64.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo xtask bundle hardwave-loudlab --release --target aarch64-apple-darwin

      - name: Package
        run: |
          cd target/bundled
          zip -r hardwave-loudlab-macos-arm64.zip hardwave-loudlab.vst3 hardwave-loudlab.clap

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hardwave-loudlab-macos-arm64
          path: target/bundled/hardwave-loudlab-macos-arm64.zip

  release:
    needs: [build-linux, build-windows, build-macos-x64, build-macos-arm64]
    # macOS: lipo and codesign do not exist on Linux.
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create universal macOS zip
        run: |
          set -euo pipefail
          # This step used to copy the arm64 build and call it "universal", so every
          # Intel Mac failed to load the plug-in — reported only as "failed to scan".
          cd artifacts/hardwave-loudlab-macos-arm64 && unzip -o -q hardwave-loudlab-macos-arm64.zip && cd ../..
          cd artifacts/hardwave-loudlab-macos-x64   && unzip -o -q hardwave-loudlab-macos-x64.zip   && cd ../..

          rm -rf universal-macos && mkdir -p universal-macos
          cp -R artifacts/hardwave-loudlab-macos-x64/hardwave-loudlab.vst3 universal-macos/
          cp -R artifacts/hardwave-loudlab-macos-x64/hardwave-loudlab.clap universal-macos/

          for K in vst3 clap; do
            lipo -create \
              artifacts/hardwave-loudlab-macos-x64/hardwave-loudlab.$K/Contents/MacOS/hardwave-loudlab \
              artifacts/hardwave-loudlab-macos-arm64/hardwave-loudlab.$K/Contents/MacOS/hardwave-loudlab \
              -output universal-macos/hardwave-loudlab.$K/Contents/MacOS/hardwave-loudlab
            codesign --force --deep --sign - universal-macos/hardwave-loudlab.$K
          done

          for K in vst3 clap; do
            A=$(lipo -archs universal-macos/hardwave-loudlab.$K/Contents/MacOS/hardwave-loudlab)
            echo "hardwave-loudlab.$K -> $A"
            case "$A" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "::error::hardwave-loudlab.$K is not universal ($A)"; exit 1 ;;
            esac
          done

          cd universal-macos
          zip -r -q hardwave-loudlab-macos-universal.zip hardwave-loudlab.vst3 hardwave-loudlab.clap

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Hardwave LoudLab ${{ steps.version.outputs.version }}
          draft: false
          # Clean tags (v0.7.0, v1.0.0) publish as a proper stable "Latest"
          # release; suffixed tags (v0.7.0-rc1, -beta) stay pre-release and not
          # latest. Mirrors the '-' gating the DB/Discord steps already use, so
          # the public launch tag isn't stuck with a "Pre-release" badge.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/hardwave-loudlab-linux-x64/*.zip
            artifacts/hardwave-loudlab-windows-x64/*.zip
            universal-macos/hardwave-loudlab-macos-universal.zip
          body: |
            ## Hardwave LoudLab ${{ steps.version.outputs.version }}

            AI-assisted mastering VST3/CLAP plugin — powered by Hardwave Studios.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows x64 | `hardwave-loudlab-windows-x64.zip` |
            | Linux x64 | `hardwave-loudlab-linux-x64.zip` |
            | macOS Universal (Intel + Apple Silicon) | `hardwave-loudlab-macos-universal.zip` |

            ### Installation

            **Windows:**
            1. Extract the zip
            2. Copy `hardwave-loudlab.vst3` folder to `C:\Program Files\Common Files\VST3\`
            3. Copy `hardwave-loudlab.clap` to `C:\Program Files\Common Files\CLAP\`

            **macOS:**
            1. Extract: `unzip hardwave-loudlab-macos-universal.zip`
            2. Copy `hardwave-loudlab.vst3` to `~/Library/Audio/Plug-Ins/VST3/`
            3. Copy `hardwave-loudlab.clap` to `~/Library/Audio/Plug-Ins/CLAP/`

            **Linux:**
            1. Extract: `unzip hardwave-loudlab-linux-x64.zip`
            2. Copy to `~/.vst3/` and `~/.clap/`

      - name: Update product database
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 46.225.219.184 >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@46.225.219.184"

          BASE="https://github.com/Dishairano/hardwave-loudlab-vst/releases/download/${VERSION}"
          $SSH "docker exec hardwave-database mysql -u fl_organizer_user -p'FlOrganizer2024Secure!' fl_organizer_db -e \"
            UPDATE products SET
              current_version       = '${VERSION_NUM}',
              download_url_windows  = '${BASE}/hardwave-loudlab-windows-x64.zip',
              download_url_mac      = '${BASE}/hardwave-loudlab-macos-universal.zip',
              download_url_linux    = '${BASE}/hardwave-loudlab-linux-x64.zip'
            WHERE slug = 'loudlab';
            INSERT INTO plugin_versions (slug, version) VALUES ('loudlab', '${VERSION}')
              ON DUPLICATE KEY UPDATE version = '${VERSION}';
          \""

          echo "Database updated: loudlab -> ${VERSION_NUM}"
          rm -f ~/.ssh/deploy_key
      - name: Post Discord changelog
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_NAME: "Hardwave LoudLab"
        run: |
          set -eu

          # ── Extract bullets for $VERSION from CHANGELOG.md ──────────────
          #
          # The CHANGELOG is the single source of truth. Each release has a
          # section "## v0.6.9 — Title (date)" followed by paragraphs and
          # one or more lists of top-level "- " bullets, possibly grouped
          # under "### Subheading" lines. We pull every top-level bullet
          # (lines starting with "- ") from the section bounded by the next
          # "## " heading.
          #
          # Falls back to the previous tag-annotation behaviour if the
          # CHANGELOG entry can't be found (e.g. a hotfix released without
          # updating the file). Final fallback is "Stability and
          # maintenance updates".
          BULLETS=""
          if [ -f CHANGELOG.md ]; then
            BULLETS=$(awk -v ver="$VERSION" '
              # Start of a new release section: header begins with "## v"
              # (immediately followed by a digit to skip "## vNEXT" etc.).
              /^## v[0-9]/ {
                # If we were inside the target section, the next "## v"
                # marks the end — exit immediately, do not consume.
                if (in_sec) exit
                # Header tokens are "##", "vX.Y.Z", ...; tokens after the
                # version may include "—", title words, and a parenthesised
                # date. We match strictly on the version token.
                if ($2 == ver) in_sec = 1
                next
              }
              # Inside the target section, capture every top-level bullet.
              # Skip "### Subheading" lines and prose.
              in_sec && /^- / {
                sub(/^- /, "")
                print
              }
            ' CHANGELOG.md | sed 's/[[:space:]]*$//')
          fi

          if [ -z "$BULLETS" ]; then
            # Fallback path 1 — old behaviour: read from the tag annotation.
            git fetch --tags --force >/dev/null 2>&1 || true
            BULLETS=$(git tag -l --format='%(contents)' "$VERSION" 2>/dev/null \
              | grep '^[[:space:]]*[-*]' \
              | sed -e 's/^[[:space:]]*[-*][[:space:]]*//' \
                    -e 's/[[:space:]]*$//' \
              || true)
          fi

          if [ -z "$BULLETS" ]; then
            BULLETS="Stability and maintenance updates"
          fi

          # Discord embed limits descriptions to 4096 chars and the whole
          # embed to 6000. Trim the bullet list to a generous 15 entries so
          # a release with 30+ items doesn't overflow — the long-form story
          # always lives in the release page anyway.
          BULLETS=$(printf '%s\n' "$BULLETS" | head -n 15)

          DESC_BODY=$(printf '%s\n' "$BULLETS" \
            | sed -e '/^[[:space:]]*$/d' \
                  -e 's/[[:space:]]*\.$//' \
                  -e 's/^/- /' \
                  -e 's/$/./')

          DESCRIPTION=$(printf "**What's new**\n%s\n\nInstall or update via the **Hardwave Suite**." "$DESC_BODY")
          PUB_DATE=$(date -u +"%-d %b %Y")
          FOOTER="${PLUGIN_NAME} · published ${PUB_DATE}"
          TITLE="${PLUGIN_NAME} ${VERSION}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg footer "$FOOTER" \
            '{
              "embeds": [{
                "title": $title,
                "description": $description,
                "color": 14427686,
                "footer": { "text": $footer }
              }]
            }')

          curl -fsS -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" >/dev/null
          echo "Discord changelog posted for ${VERSION}"

  # ── Suite beta channel ──────────────────────────────────────────────────
  # Every tagged build (stable or -suffixed prerelease) is auto-published to
  # the Suite's subscriber beta manifest. The server row supersedes the
  # previous build and expires after 21 days; Pro subscribers with the Beta
  # update channel enabled see it under Plug-ins → Beta builds.
  publish-beta:
    needs: [release]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Suite beta manifest
        env:
          INTERNAL_SECRET: ${{ secrets.HW_INTERNAL_API_SECRET }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/hardwave-loudlab-windows-x64.zip"

          # The release job just uploaded this asset; fetch it to hash it.
          curl -sfL --retry 5 --retry-delay 10 --retry-all-errors -o artefact.zip "$URL"
          SHA256=$(sha256sum artefact.zip | cut -d' ' -f1)
          SIZE=$(stat -c%s artefact.zip)
          rm -f artefact.zip

          BODY=$(printf '{"plugin_slug":"loudlab","version":"%s","artefact_url":"%s","artefact_sha256":"%s","artefact_size":%s,"changelog":"See the release notes for %s."}' "$VERSION" "$URL" "$SHA256" "$SIZE" "$VERSION")
          HTTP=$(curl -s -o resp.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-internal-secret: ${INTERNAL_SECRET}" \
            -d "$BODY" \
            https://hardwavestudios.com/api/beta/publish)
          cat resp.json
          # 409 = this version already published (idempotent re-run) — fine.
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "409" ]; then
            echo "beta publish failed with HTTP $HTTP" >&2
            exit 1
          fi
